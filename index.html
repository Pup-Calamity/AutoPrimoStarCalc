<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwordXStaff - Primostar AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1, h2, h3 { color: #ffffff; text-align: center; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 {
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            color: #4CAF50;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: center;
        }
        .input-group label { font-size: 14px; }
        .input-group input, .input-group select {
            width: 80px;
            padding: 5px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            text-align: center;
        }
        .btn-calculate {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-calculate:hover { background-color: #45a049; }
        
        /* Level grids for compact display */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .level-grid .input-group { flex-direction: column; align-items: center; margin-bottom: 5px; }
        .level-grid input { width: 100%; box-sizing: border-box; }
        
        /* Dashboard Output */
        #outputArea { margin-top: 30px; display: none; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;}
        .result-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .result-table th, .result-table td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
        .result-table th { color: #4CAF50; }
        .result-header { font-weight: bold; background-color: #2a2a2a; }
    </style>
</head>
<body>

<div class="container">
    <h1>SwordXStaff Primostar Optimizer</h1>
    
    <div class="grid-layout">
        <!-- GLOBAL SETTINGS -->
        <div class="card">
            <h3>Global & Character</h3>
            <div class="input-group"><label>Points Goal:</label><input type="number" id="pointsGoal" value="5000"></div>
            <div class="input-group"><label>Hours Left:</label><input type="number" id="hoursLeft" value="120"></div>
            <div class="input-group"><label>Saving for Next Season?</label>
                <select id="isSaving"><option value="Yes">Yes</option><option value="No">No</option></select>
            </div>
            <hr style="border-color: #333;">
            <div class="input-group"><label>Current Energy:</label><input type="number" id="currentEnergy" value="150"></div>
            <div class="input-group"><label>Current Grand Mines:</label><input type="number" id="currentGM" value="0"></div>
            <hr style="border-color: #333;">
            <div class="input-group"><label>Char Level:</label><input type="number" id="charLevel" value="60"></div>
            <div class="input-group"><label>Char Exp Into Level:</label><input type="number" id="charExp" value="1200"></div>
            <div class="input-group"><label>Char Exp / Hr:</label><input type="number" id="charExpHr" value="450"></div>
        </div>

        <!-- BAGS & MATERIAL REALMS -->
        <div class="card">
            <h3>Bags & Material Realms (MR)</h3>
            <div style="display:flex; justify-content:space-between; font-size:12px; color:#888; margin-bottom:10px;">
                <span style="width: 80px;">Material</span>
                <span style="width: 80px; text-align:center;">In Bag</span>
                <span style="width: 80px; text-align:center;">MR Left</span>
            </div>
            <div class="input-group">
                <label style="width:80px;">Rolla</label>
                <input type="number" id="bagRolla" value="15000">
                <input type="number" id="mrRolla" value="2">
            </div>
            <div class="input-group">
                <label style="width:80px;">Iron</label>
                <input type="number" id="bagIron" value="4500">
                <input type="number" id="mrIron" value="3">
            </div>
            <div class="input-group">
                <label style="width:80px;">Sand</label>
                <input type="number" id="bagSand" value="2200">
                <input type="number" id="mrSand" value="3">
            </div>
            <div class="input-group">
                <label style="width:80px;">Essence</label>
                <input type="number" id="bagEssence" value="800">
                <input type="number" id="mrEssence" value="3">
            </div>
            <div class="input-group">
                <label style="width:80px;">Treats</label>
                <input type="number" id="bagTreats" value="1200">
                <input type="number" id="mrTreats" value="0">
            </div>
        </div>
    </div>

    <!-- CURRENT LEVELS -->
    <div class="card">
        <h3>Current Item Levels</h3>
        
        <label style="color:#aaa; font-size:14px;">Gear Levels (1-5)</label>
        <div class="level-grid" id="gearInputs"></div>
        <br>
        
        <label style="color:#aaa; font-size:14px;">Skill Levels (1-8)</label>
        <div class="level-grid" id="skillInputs"></div>
        <br>

        <label style="color:#aaa; font-size:14px;">Fantomon Levels (1-4)</label>
        <div class="level-grid" id="fantomInputs"></div>
        <br>

        <label style="color:#aaa; font-size:14px;">Relic Levels (1-20)</label>
        <div class="level-grid" style="grid-template-columns: repeat(10, 1fr);" id="relicInputs"></div>
    </div>

    <br>
    <button class="btn-calculate" onclick="runApp()">Calculate Optimized Path</button>

    <!-- OUTPUT DASHBOARD -->
    <div id="outputArea">
        <h2>AI Farming Report</h2>
        <div class="results-grid" id="dashboardGrid">
            <!-- Results will inject here -->
        </div>
    </div>
</div>

<script>
    // --- 1. SETUP HTML INPUTS DYNAMICALLY ---
    function generateInputs(containerId, prefix, count, defaultVal) {
        let html = '';
        for(let i = 1; i <= count; i++) {
            html += `<div class="input-group"><label>${i}</label><input type="number" id="${prefix}${i}" value="${defaultVal}"></div>`;
        }
        document.getElementById(containerId).innerHTML = html;
    }
    
    // Auto-build the level grids
    generateInputs('gearInputs', 'gear', 5, 20);
    generateInputs('skillInputs', 'skill', 8, 10);
    generateInputs('fantomInputs', 'fantom', 4, 5);
    generateInputs('relicInputs', 'relic', 20, 15);

    // --- 2. THE BRIDGE FUNCTION ---
    function runApp() {
        // Grab Global Inputs
        let ptsGoal = Number(document.getElementById('pointsGoal').value);
        let hrsLeft = Number(document.getElementById('hoursLeft').value);
        let savingBox = document.getElementById('isSaving').value;
        let cEnergy = Number(document.getElementById('currentEnergy').value);
        let cGM = Number(document.getElementById('currentGM').value);
        
        // Grab Character Inputs (Includes Hardcoded Costs: BaseExp 5000, IncExp 150, BaseLvl 1)
        let charInputs = [
            Number(document.getElementById('charLevel').value),
            Number(document.getElementById('charExp').value),
            Number(document.getElementById('charExpHr').value),
            hrsLeft, 10750000, 50000, 130 
        ];

        // Hardcoded Drop Rates + Grabbed Bags -> [Bag, BaseDrop, MRDrop, MRAttemptsLeft]
        let rollaData = [Number(document.getElementById('bagRolla').value), 1400, 1000, Number(document.getElementById('mrRolla').value)];
        let ironData = [Number(document.getElementById('bagIron').value), 80, 400, Number(document.getElementById('mrIron').value)];
        let sandData = [Number(document.getElementById('bagSand').value), 40, 150, Number(document.getElementById('mrSand').value)];
        let essData = [Number(document.getElementById('bagEssence').value), 15, 75, Number(document.getElementById('mrEssence').value)];
        let treatData = [Number(document.getElementById('bagTreats').value), 20, 100, Number(document.getElementById('mrTreats').value)];

        // Hardcoded Upgrade Costs
        let gearCosts = [500, 50, 1000, 100, 1];     // BaseIron, IncIron, BaseRolla, IncRolla, BaseLvl
        let relicCosts = [300, 25, 800, 80, 1];      // BaseSand, IncSand, BaseRolla, IncRolla, BaseLvl
        let skillCosts = [100, 10, 1];               // BaseEss, IncEss, BaseLvl
        let fantomCosts = [50, 5, 1];                // BaseTreat, IncTreat, BaseLvl

        // Helper to grab arrays of levels
        const getLvls = (prefix, count) => Array.from({length: count}, (_, i) => Number(document.getElementById(`${prefix}${i+1}`).value));
        
        let gearLevels = getLvls('gear', 5);
        let skillLevels = getLvls('skill', 8);
        let relicLevels = getLvls('relic', 20);
        let fantomLevels = getLvls('fantom', 4);

        // Run the AI Engine!
        let results = PRIMOSTAR_OPTIMIZER(
            ptsGoal, charInputs, savingBox, cEnergy, cGM,
            rollaData, gearLevels, gearCosts, skillLevels, skillCosts, 
            relicLevels, relicCosts, fantomLevels, fantomCosts,
            ironData, sandData, essData, treatData
        );

        // Format Output into Cards
        buildDashboard(results);
    }

    // --- 3. DASHBOARD BUILDER ---
    function buildDashboard(resultsArray) {
        document.getElementById('outputArea').style.display = 'block';
        let dashGrid = document.getElementById('dashboardGrid');
        dashGrid.innerHTML = ""; 

        let currentCard = "";
        let currentTable = "";

        for(let i = 0; i < resultsArray.length; i++) {
            let row = resultsArray[i];
            
            // If it's a Header row (indicated by an empty second column)
            if (row[1] === "") {
                if (currentCard !== "") {
                    // Close previous card
                    dashGrid.innerHTML += `<div class="card"><h3>${currentCard}</h3><table class="result-table">${currentTable}</table></div>`;
                }
                currentCard = row[0].replace(/---/g, '').trim();
                currentTable = "";
            } else {
                // Add row to current table
                currentTable += `<tr><td>${row[0]}</td><td style="text-align:right; font-weight:bold;">${row[1]}</td></tr>`;
            }
        }
        // Catch the final card
        if (currentCard !== "") {
            dashGrid.innerHTML += `<div class="card"><h3>${currentCard}</h3><table class="result-table">${currentTable}</table></div>`;
        }
    }

    // --- 4. THE MASTER AI ENGINE (JavaScript) ---
    function PRIMOSTAR_OPTIMIZER(
      pointsGoal, charInputs, isSavingBox, currentEnergy, currentGM, rollaData,   
      gearLevels, gearCosts, skillLevels, skillCosts, relicLevels, relicCosts, fantomLevels, fantomCosts,
      ironData, sandData, essData, treatData 
    ) {
      const flat = (arr) => Array.isArray(arr) ? arr.flat() : [arr];
      let pointsGained = 0;
      
      let cIn = flat(charInputs);
      let charLevel = Number(cIn[0]), expIntoLevel = Number(cIn[1]), expPerHour = Number(cIn[2]);
      let hoursLeft = Number(cIn[3]), charBaseExp = Number(cIn[4]), charIncExp = Number(cIn[5]), charBaseLevel = Number(cIn[6]);
      
      let isSaving = String(isSavingBox).trim().toLowerCase() === "yes"; 
      let activeHours = hoursLeft - (isSaving ? 36 : 0);
      
      let generatedEnergy = activeHours > 0 ? (activeHours * 5) + (Math.floor(activeHours / 24) * 50) : 0;
      let totalEnergy = Number(currentEnergy) + generatedEnergy;
      
      let generatedGM = 0;
      if (activeHours > 0) {
        let now = new Date();
        let endTime = new Date(now.getTime() + (activeHours * 3600000));
        for (let d = new Date(now); d <= endTime; d.setHours(d.getHours() + 1)) {
          if (d.getDay() === 1 && d.getHours() === 9) generatedGM += 50; 
        }
      }
      let totalGM = Number(currentGM) + generatedGM;

      function createMatBank(name, dataArr, canUseGM) {
        let d = flat(dataArr);
        return {
          name: name,
          startingBag: Number(d[0]) || 0,
          bag: Number(d[0]) || 0,
          baseDrop: Number(d[1]) || 0, mrDrop: Number(d[2]) || 0, mrAttemptsLeft: Number(d[3]) || 0, 
          canUseGM: canUseGM, energySpent: 0, gmSpent: 0, mrSpent: 0, totalUsed: 0
        };
      }

      let banks = {
        "Rolla": createMatBank("Rolla", rollaData, true),
        "Iron": createMatBank("Iron", ironData, true),
        "Sand": createMatBank("Sand", sandData, true),
        "Essence": createMatBank("Essence", essData, false),
        "Treats": createMatBank("Treats", treatData, false) 
      };

      function getEnergyCost(matName, amount) {
        if (amount <= 0) return 0;
        let b = banks[matName];
        if (b.baseDrop > 0) return amount / (b.baseDrop / 5); 
        return (amount / (b.startingBag > 0 ? b.startingBag : 1)) * 500; 
      }

      let generatedExp = activeHours > 0 ? (expPerHour * activeHours) : 0;
      let expLeft = generatedExp + expIntoLevel;

      while (pointsGained < pointsGoal) {
        let charCost = charBaseExp + (charIncExp * (charLevel - charBaseLevel));
        if (expLeft >= charCost) {
          expLeft -= charCost; charLevel++; pointsGained += 100;
        } else { break; }
      }

      let allItems = [];
      function loadCat(namePrefix, levels, costs, primaryMatName, hasRolla, pointsPerLvl) {
        let lvls = flat(levels), c = flat(costs);
        let baseMats = Number(c[0]), incMats = Number(c[1]);
        let baseRolla = hasRolla ? Number(c[2]) : 0, incRolla = hasRolla ? Number(c[3]) : 0;
        let baseLevel = hasRolla ? Number(c[4]) : Number(c[2]);

        for (let i = 0; i < lvls.length; i++) {
          if (lvls[i] === "" || lvls[i] === 0) continue; 
          allItems.push({
            name: `${namePrefix} ${i + 1}`, level: Number(lvls[i]), points: pointsPerLvl,
            primaryMat: primaryMatName, baseMats: baseMats, incMats: incMats,
            usesRolla: hasRolla, baseRolla: baseRolla, incRolla: incRolla, baseLevel: baseLevel
          });
        }
      }

      loadCat("Gear", gearLevels, gearCosts, "Iron", true, 18);
      loadCat("Skill", skillLevels, skillCosts, "Essence", false, 7);
      loadCat("Relic", relicLevels, relicCosts, "Sand", true, 33);
      loadCat("Fantomon", fantomLevels, fantomCosts, "Treats", false, 8);

      function tryFarm(matName, amountNeeded, simulateOnly, simState) {
        let b = banks[matName];
        let needed = amountNeeded;
        
        if (b.bag >= needed) {
          if (!simulateOnly) b.bag -= needed;
          return true;
        }
        needed -= b.bag; 

        let tempGM = simulateOnly ? simState.gm : totalGM;
        let tempEnergy = simulateOnly ? simState.engy : totalEnergy;
        let tempMR = b.mrAttemptsLeft; 
        let simMR = 0, simGM = 0, simEnergy = 0;

        if (needed > 0 && b.baseDrop > 0 && tempEnergy >= 5) {
          let yieldPerRun = b.baseDrop;
          let runsNeeded = Math.ceil(needed / yieldPerRun);
          let runsAllowed = Math.floor(tempEnergy / 5);
          let runsToSpend = Math.min(runsNeeded, runsAllowed);
          
          simEnergy += (runsToSpend * 5);
          tempEnergy -= (runsToSpend * 5);
          needed -= (runsToSpend * yieldPerRun);
        }
        if (needed > 0 && b.canUseGM && b.baseDrop > 0 && tempGM > 0) {
          let yieldPerRun = b.baseDrop * 2;
          let runsNeeded = Math.ceil(needed / yieldPerRun);
          let runsToSpend = Math.min(runsNeeded, tempGM);
          simGM += runsToSpend; tempGM -= runsToSpend;
          needed -= (runsToSpend * yieldPerRun);
        }
        if (needed > 0 && b.mrDrop > 0 && tempMR > 0) {
          let yieldPerRun = b.mrDrop;
          let runsNeeded = Math.ceil(needed / yieldPerRun);
          let runsToSpend = Math.min(runsNeeded, tempMR);
          simMR += runsToSpend; tempMR -= runsToSpend;
          needed -= (runsToSpend * yieldPerRun);
        }

        if (needed > 0) return false;

        if (simulateOnly) {
          simState.gm = tempGM; simState.engy = tempEnergy;
        } else {
          b.bag = Math.abs(needed); 
          b.energySpent += simEnergy; totalEnergy -= simEnergy;
          b.gmSpent += simGM; totalGM -= simGM;
          b.mrSpent += simMR; b.mrAttemptsLeft -= simMR;
        }
        return true;
      }

      while (pointsGained < pointsGoal) {
        let bestItem = null;
        let highestEfficiency = -1;

        for (let i = 0; i < allItems.length; i++) {
          let item = allItems[i];
          let matCost = item.baseMats + (item.incMats * (item.level - item.baseLevel));
          let rollaCost = item.usesRolla ? item.baseRolla + (item.incRolla * (item.level - item.baseLevel)) : 0;

          let simState = { engy: totalEnergy, gm: totalGM };
          let canAffordMats = tryFarm(item.primaryMat, matCost, true, simState);
          let canAffordRolla = item.usesRolla ? tryFarm("Rolla", rollaCost, true, simState) : true;

          if (canAffordMats && canAffordRolla) {
            let matEngyCost = getEnergyCost(item.primaryMat, matCost);
            let rollaEngyCost = item.usesRolla ? getEnergyCost("Rolla", rollaCost) : 0;
            let efficiency = item.points / (matEngyCost + rollaEngyCost);

            let isBetter = false;
            if (efficiency > highestEfficiency + 0.000001) {
              isBetter = true;
            } else if (Math.abs(efficiency - highestEfficiency) <= 0.000001) {
              if (!bestItem || item.level < bestItem.level) isBetter = true;
            }

            if (isBetter) {
              highestEfficiency = efficiency; bestItem = item;
              bestItem.currentMatCost = matCost; bestItem.currentRollaCost = rollaCost;
            }
          }
        }

        if (!bestItem) break; 

        tryFarm(bestItem.primaryMat, bestItem.currentMatCost, false);
        banks[bestItem.primaryMat].totalUsed += bestItem.currentMatCost;
        if (bestItem.usesRolla) {
          tryFarm("Rolla", bestItem.currentRollaCost, false);
          banks["Rolla"].totalUsed += bestItem.currentRollaCost;
        }
        
        bestItem.level++;
        pointsGained += bestItem.points;
      }

      let output = [];
      output.push(["--- CHARACTER ---", ""]);
      output.push(["Character Level", charLevel]);
      
      output.push(["--- OPTIMIZED LEVELS ---", ""]);
      for (let i = 0; i < allItems.length; i++) {
        output.push([allItems[i].name, allItems[i].level]);
      }
      
      output.push(["--- AI FARMING PLAN ---", ""]);
      Object.keys(banks).forEach(key => {
        let b = banks[key];
        if (b.energySpent > 0 || b.gmSpent > 0 || b.mrSpent > 0) {
          output.push([`${key} Farming`, `${b.energySpent} Engy | ${b.gmSpent} GM | ${b.mrSpent} MR`]);
        }
      });
      
      output.push(["--- MATERIALS USED ---", ""]);
      output.push(["Iron Used", Math.floor(banks["Iron"].totalUsed)]);
      output.push(["Sand Used", Math.floor(banks["Sand"].totalUsed)]);
      output.push(["Essence Used", Math.floor(banks["Essence"].totalUsed)]);
      output.push(["Rolla Used", Math.floor(banks["Rolla"].totalUsed)]);
      output.push(["Treats Used", Math.floor(banks["Treats"].totalUsed)]);

      output.push(["--- RESOURCES LEFT ---", ""]);
      output.push(["Energy Left", totalEnergy]);
      output.push(["Grand Mines Left", totalGM]);
      output.push(["Iron Left", Math.floor(banks["Iron"].bag)]);
      output.push(["Sand Left", Math.floor(banks["Sand"].bag)]);
      output.push(["Essence Left", Math.floor(banks["Essence"].bag)]);
      output.push(["Rolla Left", Math.floor(banks["Rolla"].bag)]);
      output.push(["Treats Left", Math.floor(banks["Treats"].bag)]);
      output.push(["Total Points Reached", pointsGained]);

      return output;
    }
</script>
</body>
</html>
