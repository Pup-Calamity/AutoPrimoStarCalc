<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwordXStaff - Primostar AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1, h2, h3 { color: #fff; text-align: center; margin-top: 0; }
        .container { max-width: 1400px; margin: 0 auto; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h3 { border-bottom: 2px solid #333; padding-bottom: 10px; color: #d32f2f; }
        .card.gear h3 { color: #757575; }
        .card.skills h3 { color: #5e35b1; }
        .card.fantom h3 { color: #2e7d32; }
        .card.relic h3 { color: #1976d2; }
        
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
        .input-group input, .input-group select { width: 120px; padding: 6px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; text-align: center; }
        .input-group input[type="datetime-local"] { width: 180px; }
        
        .table-header { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 10px; font-weight: bold; }
        .table-header span { width: 80px; text-align: center; }
        
        .btn-calc { width: 100%; padding: 15px; background: #d32f2f; color: white; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-calc:hover { background: #b71c1c; }
        
        #outputArea { margin-top: 30px; display: none; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;}
        .result-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .result-table th, .result-table td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>SwordXStaff Primostar Optimizer</h1>
    
    <div class="grid-layout">
        <!-- TIME & GOALS -->
        <div class="card">
            <h3 style="color: #d32f2f;">Date/Time & Goals</h3>
            <div class="input-group"><label>Current Date/Time:</label><input type="datetime-local" id="currentDate" value="2026-08-28T13:58"></div>
            <div class="input-group"><label>Season Ends:</label><input type="datetime-local" id="seasonEnds" value="2026-09-09T08:59"></div>
            <hr style="border-color:#333;">
            <div class="input-group"><label>Previous Season Total:</label><input type="number" id="prevTotal" value="271"></div>
            <div class="input-group"><label>Goal:</label><input type="number" id="goalPts" value="1200"></div>
            <div class="input-group"><label>Saving 36 Hrs XP?</label><select id="saveXP"><option value="YES">YES</option><option value="NO">NO</option></select></div>
            <hr style="border-color:#333;">
            <div class="input-group"><label>Current Energy (Total):</label><input type="number" id="currentEnergy" value="0"></div>
            <div class="input-group"><label>Current Grand Mines:</label><input type="number" id="currentGM" value="0"></div>
        </div>

        <!-- PASSIVE & BAGS -->
        <div class="card">
            <h3 style="color: #b76e00;">Production & Bags</h3>
            <div class="table-header"><span style="text-align:left; width:100px;">Resource</span><span>Cart / Hr</span><span>On Hand</span></div>
            <div class="input-group"><label style="width:100px;">Iron</label><input type="number" id="cartIron" value="2204"><input type="number" id="bagIron" value="422000"></div>
            <div class="input-group"><label style="width:100px;">Essence</label><input type="number" id="cartEssence" value="2685"><input type="number" id="bagEssence" value="268000"></div>
            <div class="input-group"><label style="width:100px;">Sand</label><input type="number" id="cartSand" value="1516"><input type="number" id="bagSand" value="228000"></div>
            <div class="input-group"><label style="width:100px;">Rolla</label><input type="number" id="cartRolla" value="19070"><input type="number" id="bagRolla" value="964000"></div>
            <div class="input-group"><label style="width:100px;">Treats (Brown)</label><input type="number" id="cartTreats" value="189"><span>(See Fantomon)</span></div>
        </div>

        <!-- MATERIAL REALMS -->
        <div class="card">
            <h3 style="color: #d32f2f;">Material Realms</h3>
            <div class="table-header"><span style="text-align:left; width:100px;">Realm Tool</span><span>In Bag</span><span>Daily Buys</span></div>
            <div class="input-group"><label style="width:100px;">Hammers (Iron)</label><input type="number" id="mrHammers" value="212"><input type="number" id="dailyIron" value="4"></div>
            <div class="input-group"><label style="width:100px;">Gloves (Essence)</label><input type="number" id="mrGloves" value="323"><input type="number" id="dailyEssence" value="2"></div>
            <div class="input-group"><label style="width:100px;">Shovels (Sand)</label><input type="number" id="mrShovels" value="144"><input type="number" id="dailySand" value="2"></div>
            <div class="input-group"><label style="width:100px;">Gold Pick (Rolla)</label><input type="number" id="mrPicks" value="101"><input type="number" id="dailyRolla" value="2"></div>
        </div>
    </div>

    <!-- LEVELS SECTION -->
    <div class="grid-layout">
        <!-- CHAR & GEAR -->
        <div class="card gear">
            <h3>Character & Gear</h3>
            <div class="input-group"><label>Char Level</label><input type="number" id="charLevel" value="189"></div>
            <div class="input-group"><label>Char Current XP</label><input type="number" id="charXP" value="11200000"></div>
            <div class="input-group"><label>Bed Exp / Hr</label><input type="number" id="bedExpHr" value="705948"></div>
            <hr style="border-color:#333;">
            <div class="input-group"><label>Weapon</label><input type="number" id="gear1" value="200"></div>
            <div class="input-group"><label>Off-Hand</label><input type="number" id="gear2" value="191"></div>
            <div class="input-group"><label>Helm</label><input type="number" id="gear3" value="197"></div>
            <div class="input-group"><label>Armor</label><input type="number" id="gear4" value="195"></div>
            <div class="input-group"><label>Boots</label><input type="number" id="gear5" value="200"></div>
        </div>

        <!-- SKILLS & FANTOMON -->
        <div class="card skills">
            <h3>Skills & Fantomon</h3>
            <div style="display:flex; justify-content:space-between;">
                <div style="width: 48%;" id="skillContainer">
                    <!-- Injected via JS -->
                </div>
                <div style="width: 48%;">
                    <div class="input-group"><label>Brown Foods</label><input type="number" id="foodBrown" value="22600" style="width:70px;"></div>
                    <div class="input-group"><label>Blue Foods</label><input type="number" id="foodBlue" value="46" style="width:70px;"></div>
                    <div class="input-group"><label>Purple Foods</label><input type="number" id="foodPurple" value="32" style="width:70px;"></div>
                    <hr style="border-color:#333;">
                    <div class="input-group"><label>Main</label><input type="number" id="fantom1" value="173" style="width:70px;"></div>
                    <div class="input-group"><label>Off 1</label><input type="number" id="fantom2" value="173" style="width:70px;"></div>
                    <div class="input-group"><label>Off 2</label><input type="number" id="fantom3" value="173" style="width:70px;"></div>
                    <div class="input-group"><label>Off 3</label><input type="number" id="fantom4" value="173" style="width:70px;"></div>
                </div>
            </div>
        </div>

        <!-- RELICS -->
        <div class="card relic">
            <h3>Relics</h3>
            <div style="display:flex; justify-content:space-between; flex-wrap: wrap;" id="relicContainer">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <button class="btn-calc" onclick="runApp()">Run Optimization</button>

    <div id="outputArea">
        <h2>AI Farming Report</h2>
        <div class="results-grid" id="dashboardGrid"></div>
    </div>
</div>

<script>
    // --- 1. UI GENERATION ---
    let skillHtml = "";
    for(let i=1; i<=8; i++) skillHtml += `<div class="input-group"><label>Position ${i}</label><input type="number" id="skill${i}" value="168" style="width:60px;"></div>`;
    document.getElementById('skillContainer').innerHTML = skillHtml;

    let relicHtml = "";
    const elements = ["Light", "Dark", "Wind", "Water", "Fire"];
    elements.forEach((el, idx) => {
        let col = `<div style="width:30%;">`;
        for(let i=1; i<=4; i++) col += `<div class="input-group"><label>${el} ${i}</label><input type="number" id="relic${(idx*4)+i}" value="20" style="width:50px;"></div>`;
        col += `</div>`;
        relicHtml += col;
    });
    document.getElementById('relicContainer').innerHTML = relicHtml;

    // --- 2. BRIDGE FUNCTION ---
    function runApp() {
        // Time Math
        let d1 = new Date(document.getElementById('currentDate').value);
        let d2 = new Date(document.getElementById('seasonEnds').value);
        let hoursl = Math.max(0, (d2 - d1) / (1000 * 60 * 60));
        let daysLeft = Math.floor(hoursl / 24);
        let hoursLeft = hoursl + (2*daysLeft)
        // Goal Math
        let ptsGoal = (Number(document.getElementById('goalPts').value) - Number(document.getElementById('prevTotal').value)) * 27;
        let cEnergy = Number(document.getElementById('currentEnergy').value);
        let cGM = Number(document.getElementById('currentGM').value);
        let saveXP = document.getElementById('saveXP').value;

        // Character XP Generation
        let charInputs = [
            Number(document.getElementById('charLevel').value),
            Number(document.getElementById('charXP').value),
            Number(document.getElementById('bedExpHr').value),
            hoursLeft, 10750000, 50000, 130 // Replace 5000/150 with actual char base/inc costs if you have them
        ];

        // Fantomon Treat Math (Brown=50, Blue=400, Purple=2000)
        let totalTreatXP = (Number(document.getElementById('foodBrown').value) * 50) + 
                           (Number(document.getElementById('foodBlue').value) * 400) + 
                           (Number(document.getElementById('foodPurple').value) * 2000);
        
        let cartTreatsHr = Number(document.getElementById('cartTreats').value);
        let passiveTreatXP = cartTreatsHr * hoursLeft * 50; // Cart produces brown treats
        totalTreatXP += passiveTreatXP;

        // Material Realm (MR) Attempts = On Hand + (Daily Buys * 5 * Days Left)
        let mrIron = Number(document.getElementById('mrHammers').value) + (Number(document.getElementById('dailyIron').value) * 5 * daysLeft);
        let mrEssence = Number(document.getElementById('mrGloves').value) + (Number(document.getElementById('dailyEssence').value) * 5 * daysLeft);
        let mrSand = Number(document.getElementById('mrShovels').value) + (Number(document.getElementById('dailySand').value) * 5 * daysLeft);
        let mrRolla = Number(document.getElementById('mrPicks').value) + (Number(document.getElementById('dailyRolla').value) * 5 * daysLeft);

        // Calculate Passive Bags (Starting Bag + (Cart/Hr * Hours Left))
        let bagIron = Number(document.getElementById('bagIron').value) + (Number(document.getElementById('cartIron').value) * hoursLeft);
        let bagEssence = Number(document.getElementById('bagEssence').value) + (Number(document.getElementById('cartEssence').value) * hoursLeft);
        let bagSand = Number(document.getElementById('bagSand').value) + (Number(document.getElementById('cartSand').value) * hoursLeft);
        let bagRolla = Number(document.getElementById('bagRolla').value) + (Number(document.getElementById('cartRolla').value) * hoursLeft);

        // Setup Data Arrays: [Bag, BaseDrop, MRDrop, MRAttemptsLeft]
        // NOTE: Replace the middle two numbers (BaseDrop, MRDrop) with your actual drop rates!
        let rollaData = [bagRolla, 14000, 9440, mrRolla];
        let ironData = [bagIron, 1400, 944, mrIron];
        let sandData = [bagSand, 1175, 826, mrSand];
        let essData = [bagEssence, 1875, 1180, mrEssence];
        
        // Treat Data logic: Treat drops per energy aren't explicitly farmed via Energy based on your notes, so Base/MR set to 0 to trigger Scarcity mode.
        let treatData = [totalTreatXP, 0, 0, 0];

        // Hardcoded Upgrade Costs [BaseMat, IncMat, BaseRolla, IncRolla, BaseLevel]
        // NOTE: Replace these with your actual game costs!
        let gearCosts = [16556, 168, 32800, 340, 130];     
        let relicCosts = [33500, 3425, 61000, 6000, 13];      
        let skillCosts = [11887, 123, 130];               
        let fantomCosts = [57316, 1148, 130];                

        const getLvls = (prefix, count) => Array.from({length: count}, (_, i) => Number(document.getElementById(`${prefix}${i+1}`).value));
        
        let results = PRIMOSTAR_OPTIMIZER(
            ptsGoal, charInputs, saveXP, cEnergy, cGM,
            rollaData, getLvls('gear', 5), gearCosts, getLvls('skill', 8), skillCosts, 
            getLvls('relic', 20), relicCosts, getLvls('fantom', 4), fantomCosts,
            ironData, sandData, essData, treatData
        );

        buildDashboard(results);
    }

    // --- 3. DASHBOARD BUILDER ---
    function buildDashboard(resultsArray) {
        document.getElementById('outputArea').style.display = 'block';
        let dashGrid = document.getElementById('dashboardGrid');
        dashGrid.innerHTML = ""; 
        let currentCard = "", currentTable = "";

        for(let i = 0; i < resultsArray.length; i++) {
            let row = resultsArray[i];
            
            // Detect header row (2 items, 2nd is empty)
            if (row.length === 2 && row[1] === "") {
                if (currentCard !== "") dashGrid.innerHTML += `<div class="card"><h3>${currentCard}</h3><table class="result-table">${currentTable}</table></div>`;
                currentCard = row[0].replace(/---/g, '').trim();
                currentTable = "";
            } else {
                // Build dynamic columns based on array length
                currentTable += `<tr>`;
                for(let j=0; j < row.length; j++) {
                    let align = (j === 0) ? 'left' : 'right';
                    let weight = (j > 0) ? 'bold' : 'normal';
                    currentTable += `<td style="text-align:${align}; font-weight:${weight};">${row[j]}</td>`;
                }
                currentTable += `</tr>`;
            }
        }
        if (currentCard !== "") dashGrid.innerHTML += `<div class="card"><h3>${currentCard}</h3><table class="result-table">${currentTable}</table></div>`;
    }

    // --- 4. MASTER AI ENGINE ---
    function PRIMOSTAR_OPTIMIZER(
      pointsGoal, charInputs, isSavingBox, currentEnergy, currentGM, rollaData,   
      gearLevels, gearCosts, skillLevels, skillCosts, relicLevels, relicCosts, fantomLevels, fantomCosts,
      ironData, sandData, essData, treatData 
    ) {
      const flat = (arr) => Array.isArray(arr) ? arr.flat() : [arr];
      let pointsGained = 0;
      
      let cIn = flat(charInputs);
      let charLevel = Number(cIn[0]), expIntoLevel = Number(cIn[1]), expPerHour = Number(cIn[2]);
      let hoursLeft = Number(cIn[3]), charBaseExp = Number(cIn[4]), charIncExp = Number(cIn[5]), charBaseLevel = Number(cIn[6]);
      
      let isSaving = String(isSavingBox).trim().toLowerCase() === "yes"; 
      let activeHours = Math.max(0, hoursLeft - (isSaving ? 36 : 0));
      
      let generatedEnergy = activeHours > 0 ? (activeHours * 5) + (Math.floor(activeHours / 24) * 50) : 0;
      let totalEnergy = Number(currentEnergy) + generatedEnergy;
      
      let generatedGM = 0;
      if (activeHours > 0) {
        let now = new Date();
        let endTime = new Date(now.getTime() + (activeHours * 3600000));
        for (let d = new Date(now); d <= endTime; d.setHours(d.getHours() + 1)) {
          if (d.getDay() === 1 && d.getHours() === 9) generatedGM += 50; 
        }
      }
      let totalGM = Number(currentGM) + generatedGM;

      // --- PRE-CALCULATE CURRENT VERIFICATION LEVELS ---
      let startChar = charLevel; // Adjust if game subtracts base (e.g., charLevel - 130)
      let sumGear = flat(gearLevels).reduce((a, b) => a + Number(b), 0);
      let sumSkill = flat(skillLevels).reduce((a, b) => a + Number(b), 0);
      let sumRelic = flat(relicLevels).reduce((a, b) => a + Number(b), 0);
      let sumFantom = flat(fantomLevels).reduce((a, b) => a + Number(b), 0);

      function createMatBank(name, dataArr, canUseGM) {
        let d = flat(dataArr);
        return {
          name: name, startingBag: Number(d[0]) || 0, bag: Number(d[0]) || 0,
          baseDrop: Number(d[1]) || 0, mrDrop: Number(d[2]) || 0, mrAttemptsLeft: Number(d[3]) || 0, 
          canUseGM: canUseGM, energySpent: 0, gmSpent: 0, mrSpent: 0, totalUsed: 0
        };
      }

      let banks = {
        "Rolla": createMatBank("Rolla", rollaData, true),
        "Iron": createMatBank("Iron", ironData, true),
        "Sand": createMatBank("Sand", sandData, true),
        "Essence": createMatBank("Essence", essData, false),
        "Treats": createMatBank("Treats", treatData, false) 
      };

      function getEnergyCost(matName, amount) {
        if (amount <= 0) return 0;
        let b = banks[matName];
        if (b.baseDrop > 0) return amount / (b.baseDrop / 5); 
        return (amount / (b.startingBag > 0 ? b.startingBag : 1)) * 500; 
      }

      let generatedExp = activeHours > 0 ? (expPerHour * activeHours) : 0;
      let expLeft = generatedExp + expIntoLevel;

      while (pointsGained < pointsGoal) {
        let charCost = charBaseExp + (charIncExp * (charLevel - charBaseLevel));
        if (expLeft >= charCost) {
          expLeft -= charCost; charLevel++; pointsGained += 100;
        } else { break; }
      }

      let allItems = [];
      function loadCat(namePrefix, levels, costs, primaryMatName, hasRolla, pointsPerLvl) {
        let lvls = flat(levels), c = flat(costs);
        let baseMats = Number(c[0]), incMats = Number(c[1]);
        let baseRolla = hasRolla ? Number(c[2]) : 0, incRolla = hasRolla ? Number(c[3]) : 0;
        let baseLevel = hasRolla ? Number(c[4]) : Number(c[2]);

        for (let i = 0; i < lvls.length; i++) {
          if (lvls[i] === "" || lvls[i] === 0) continue; 
          allItems.push({
            name: `${namePrefix} ${i + 1}`, level: Number(lvls[i]), points: pointsPerLvl,
            primaryMat: primaryMatName, baseMats: baseMats, incMats: incMats,
            usesRolla: hasRolla, baseRolla: baseRolla, incRolla: incRolla, baseLevel: baseLevel
          });
        }
      }

      loadCat("Gear", gearLevels, gearCosts, "Iron", true, 18);
      loadCat("Skill", skillLevels, skillCosts, "Essence", false, 7);
      loadCat("Relic", relicLevels, relicCosts, "Sand", true, 33);
      loadCat("Fantomon", fantomLevels, fantomCosts, "Treats", false, 8);

      function tryFarm(matName, amountNeeded, simulateOnly, simState) {
        let b = banks[matName];
        let needed = amountNeeded;
        
        if (b.bag >= needed) {
          if (!simulateOnly) b.bag -= needed;
          return true;
        }
        needed -= b.bag; 

        let tempGM = simulateOnly ? simState.gm : totalGM;
        let tempEnergy = simulateOnly ? simState.engy : totalEnergy;
        let tempMR = b.mrAttemptsLeft; 
        let simMR = 0, simGM = 0, simEnergy = 0;

        if (needed > 0 && b.baseDrop > 0 && tempEnergy >= 5) {
          let yieldPerRun = b.baseDrop;
          let runsNeeded = Math.ceil(needed / yieldPerRun);
          let runsAllowed = Math.floor(tempEnergy / 5);
          let runsToSpend = Math.min(runsNeeded, runsAllowed);
          simEnergy += (runsToSpend * 5); tempEnergy -= (runsToSpend * 5); needed -= (runsToSpend * yieldPerRun);
        }
        if (needed > 0 && b.canUseGM && b.baseDrop > 0 && tempGM > 0) {
          let yieldPerRun = b.baseDrop * 2;
          let runsNeeded = Math.ceil(needed / yieldPerRun);
          let runsToSpend = Math.min(runsNeeded, tempGM);
          simGM += runsToSpend; tempGM -= runsToSpend; needed -= (runsToSpend * yieldPerRun);
        }
        if (needed > 0 && b.mrDrop > 0 && tempMR > 0) {
          let yieldPerRun = b.mrDrop;
          let runsNeeded = Math.ceil(needed / yieldPerRun);
          let runsToSpend = Math.min(runsNeeded, tempMR);
          simMR += runsToSpend; tempMR -= runsToSpend; needed -= (runsToSpend * yieldPerRun);
        }

        if (needed > 0) return false;

        if (simulateOnly) {
          simState.gm = tempGM; simState.engy = tempEnergy;
        } else {
          b.bag = Math.abs(needed); 
          b.energySpent += simEnergy; totalEnergy -= simEnergy;
          b.gmSpent += simGM; totalGM -= simGM;
          b.mrSpent += simMR; b.mrAttemptsLeft -= simMR;
        }
        return true;
      }

      while (pointsGained < pointsGoal) {
        let bestItem = null;
        let highestEfficiency = -1;

        for (let i = 0; i < allItems.length; i++) {
          let item = allItems[i];
          let matCost = item.baseMats + (item.incMats * (item.level - item.baseLevel));
          let rollaCost = item.usesRolla ? item.baseRolla + (item.incRolla * (item.level - item.baseLevel)) : 0;

          let simState = { engy: totalEnergy, gm: totalGM };
          let canAffordMats = tryFarm(item.primaryMat, matCost, true, simState);
          let canAffordRolla = item.usesRolla ? tryFarm("Rolla", rollaCost, true, simState) : true;

          if (canAffordMats && canAffordRolla) {
            let matEngyCost = getEnergyCost(item.primaryMat, matCost);
            let rollaEngyCost = item.usesRolla ? getEnergyCost("Rolla", rollaCost) : 0;
            let efficiency = item.points / (matEngyCost + rollaEngyCost);

            let isBetter = false;
            if (efficiency > highestEfficiency + 0.000001) isBetter = true;
            else if (Math.abs(efficiency - highestEfficiency) <= 0.000001) {
              if (!bestItem || item.level < bestItem.level) isBetter = true;
            }

            if (isBetter) {
              highestEfficiency = efficiency; bestItem = item;
              bestItem.currentMatCost = matCost; bestItem.currentRollaCost = rollaCost;
            }
          }
        }

        if (!bestItem) break; 

        tryFarm(bestItem.primaryMat, bestItem.currentMatCost, false);
        banks[bestItem.primaryMat].totalUsed += bestItem.currentMatCost;
        if (bestItem.usesRolla) {
          tryFarm("Rolla", bestItem.currentRollaCost, false);
          banks["Rolla"].totalUsed += bestItem.currentRollaCost;
        }
        bestItem.level++; pointsGained += bestItem.points;
      }

      let output = [];
      
      // 1. Goal Status Message
      output.push(["--- GOAL STATUS ---", ""]);
      if (pointsGained >= pointsGoal) {
          output.push(["Status", "✅ Goal Achievable!"]);
          output.push(["Points Gained", `${pointsGained} / ${pointsGoal}`]);
      } else {
          output.push(["Status", "❌ Not Enough Resources"]);
          output.push(["Max Points Possible", `${pointsGained} / ${pointsGoal}`]);
          output.push(["Shortfall", `${pointsGoal - pointsGained} Points`]);
      }

      // 2. Verification Grid (4 Columns)
      output.push(["--- CURRENT OBTAINED LEVELS ---", ""]);
      output.push(["Category", "Prog Levels", "Prog Points", "Primostars"]);
      output.push(["Character Level", startChar, startChar * 100, Math.floor((startChar * 100) / 27)]);
      output.push(["Gear", sumGear, sumGear * 18, Math.floor((sumGear * 18) / 27)]);
      output.push(["Relic", sumRelic, sumRelic * 33, Math.floor((sumRelic * 33) / 27)]);
      output.push(["Skills", sumSkill, sumSkill * 7, Math.floor((sumSkill * 7) / 27)]);
      output.push(["Fantomon", sumFantom, sumFantom * 8, Math.floor((sumFantom * 8) / 27)]);
      output.push(["Guaranteed", "-", "-", 45]);

      // 3. AI Farming Plan
      output.push(["--- AI FARMING PLAN ---", ""]);
      Object.keys(banks).forEach(key => {
        let b = banks[key];
        if (b.energySpent > 0 || b.gmSpent > 0 || b.mrSpent > 0) output.push([`${key} Farming`, `${b.energySpent} Engy | ${b.gmSpent} GM | ${b.mrSpent} MR`]);
      });

      // 4. Character & Segmented Levels
      output.push(["--- CHARACTER END LEVEL ---", ""]);
      output.push(["Character Level", charLevel]);

      output.push(["--- GEAR UPGRADES ---", ""]);
      allItems.filter(i => i.name.startsWith("Gear")).forEach(i => output.push([i.name, i.level]));
      
      output.push(["--- SKILLS UPGRADES ---", ""]);
      allItems.filter(i => i.name.startsWith("Skill")).forEach(i => output.push([i.name, i.level]));
      
      output.push(["--- FANTOMON UPGRADES ---", ""]);
      allItems.filter(i => i.name.startsWith("Fantomon")).forEach(i => output.push([i.name, i.level]));
      
      output.push(["--- RELICS UPGRADES ---", ""]);
      allItems.filter(i => i.name.startsWith("Relic")).forEach(i => output.push([i.name, i.level]));
      
      // 5. Materials Used
      output.push(["--- MATERIALS USED ---", ""]);
      output.push(["Iron Used", Math.floor(banks["Iron"].totalUsed)]);
      output.push(["Sand Used", Math.floor(banks["Sand"].totalUsed)]);
      output.push(["Essence Used", Math.floor(banks["Essence"].totalUsed)]);
      output.push(["Rolla Used", Math.floor(banks["Rolla"].totalUsed)]);
      output.push(["Treat XP Used", Math.floor(banks["Treats"].totalUsed)]);

      // 6. Resources Left
      output.push(["--- RESOURCES LEFT ---", ""]);
      output.push(["Energy Left", totalEnergy]);
      output.push(["Grand Mines Left", totalGM]);
      output.push(["Iron Left", Math.floor(banks["Iron"].bag)]);
      output.push(["Sand Left", Math.floor(banks["Sand"].bag)]);
      output.push(["Essence Left", Math.floor(banks["Essence"].bag)]);
      output.push(["Rolla Left", Math.floor(banks["Rolla"].bag)]);
      output.push(["Treat XP Left", Math.floor(banks["Treats"].bag)]);

      return output;
    }
</script>
